  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
    :root {
      --ink: #020617;      /* 밤바다 */
      --panel: #0f172a;
      --line: #1e293b;
      --muted: #94a3b8;
      --text: #e2e8f0;
      --sea: #22d3ee;      /* 영해 */
      --land: #34d399;     /* 완료 */
      --sky: #fbbf24;      /* 영공 */
      --bar-h: 48px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { overflow: hidden; -webkit-user-select: none; user-select: none; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }

    /* ---------- 시작 화면 ---------- */
    #login { height: 100dvh; overflow-y: auto; display: flex; align-items: center; justify-content: center; padding: 20px;
      background:
        radial-gradient(ellipse 80% 50% at 50% 110%, rgba(34, 211, 238, .12), transparent 70%),
        radial-gradient(ellipse 60% 40% at 50% -10%, rgba(251, 191, 36, .08), transparent 70%),
        var(--ink); }
    .login-card { width: 100%; max-width: 520px; }
    .login-card h1 { margin: 0 0 6px; font-size: clamp(26px, 5vw, 38px); font-weight: 900; letter-spacing: -0.02em; line-height: 1.2; }
    .login-card .sub { margin: 0 0 28px; color: var(--muted); font-size: 15px; }
    .route { list-style: none; margin: 0 0 28px; padding: 0; border-left: 2px solid var(--line); }
    .route li { position: relative; padding: 0 0 18px 22px; }
    .route li:last-child { padding-bottom: 0; }
    .route li::before { content: attr(data-n); position: absolute; left: -13px; top: -1px; width: 24px; height: 24px;
      border-radius: 50%; background: var(--panel); border: 2px solid var(--line); font-size: 12px; font-weight: 800;
      display: grid; place-items: center; color: var(--muted); }
    .route li:nth-child(1)::before { border-color: var(--sky); color: var(--sky); }
    .route li:nth-child(2)::before { border-color: var(--sea); color: var(--sea); }
    .route li:nth-child(3)::before { border-color: var(--land); color: var(--land); }
    .route b { display: block; font-size: 16px; margin-bottom: 2px; }
    .route span { color: var(--muted); font-size: 13.5px; line-height: 1.5; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .fields input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid #334155; background: var(--panel);
      color: #fff; font: inherit; font-size: 16px; }
    .fields input:focus { border-color: var(--sea); outline: none; }
    .fields .full { grid-column: 1 / -1; }
    #loginWarn { min-height: 20px; margin: 8px 0 0; color: #fb7185; font-size: 13px; }
    #startBtn { width: 100%; margin-top: 8px; padding: 16px; border: 0; border-radius: 12px; font-size: 17px; font-weight: 900;
      color: var(--ink); background: linear-gradient(90deg, var(--sea), var(--land)); }
    #startBtn:active { transform: scale(.98); }

    /* ---------- 상단 진행 바 ---------- */
    #app { display: none; height: 100dvh; flex-direction: column; }
    #app.on { display: flex; }
    .bar { height: var(--bar-h); flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 12px;
      background: var(--panel); border-bottom: 1px solid var(--line); }
    .brand { font-weight: 900; font-size: 14px; white-space: nowrap; color: #fff; }
    .steps { display: flex; gap: 4px; flex: 0 1 auto; min-width: 0; }
    .step { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 1px solid transparent;
      background: transparent; color: #475569; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .step i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
      font-size: 11px; font-weight: 900; background: var(--line); color: #64748b; }
    .step.open { color: var(--muted); }
    .step.open:hover { background: rgba(255,255,255,.04); }
    .step.done i { background: var(--land); color: var(--ink); }
    .step.now { color: #fff; border-color: rgba(34, 211, 238, .5); background: rgba(34, 211, 238, .1); }
    .step.now i { background: var(--sea); color: var(--ink); }
    .step:disabled { cursor: default; }
    .status { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; justify-content: flex-end;
      font-size: 12.5px; color: var(--muted); overflow: hidden; white-space: nowrap; }
    .chip { padding: 3px 8px; border-radius: 999px; border: 1px solid #334155; color: #64748b; font-weight: 700; }
    .chip.ok { border-color: rgba(52, 211, 153, .6); color: var(--land); background: rgba(52, 211, 153, .08); }
    .who { font-size: 12.5px; color: var(--muted); white-space: nowrap; padding-left: 10px; border-left: 1px solid var(--line); }
    .who b { color: #fff; }
    #nextBtn { display: none; padding: 8px 14px; border: 0; border-radius: 10px; font-weight: 900; font-size: 13px;
      color: var(--ink); background: linear-gradient(90deg, var(--sea), var(--land)); white-space: nowrap;
      animation: glow 1.6s ease-in-out infinite; }
    #nextBtn.on { display: block; }
    @keyframes glow { 50% { box-shadow: 0 0 0 5px rgba(34, 211, 238, .25); } }

    /* ---------- 활동 화면 ---------- */
    .stage { position: relative; flex: 1; min-height: 0; }
    .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--ink); }
    .stage iframe.on { display: block; }

    #toast { position: fixed; left: 50%; top: calc(var(--bar-h) + 12px); transform: translate(-50%, -20px); opacity: 0;
      padding: 10px 16px; border-radius: 12px; background: #064e3b; border: 1px solid var(--land); color: #d1fae5;
      font-weight: 800; font-size: 14px; transition: .35s; pointer-events: none; z-index: 10; }
    #toast.on { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 900px) { .brand, .who { display: none; } }
    @media (max-width: 640px) { .step span { display: none; } .status .label { display: none; } }
    @media (prefers-reduced-motion: reduce) { #nextBtn { animation: none; } #toast { transition: none; } }
  </style>
</head>
<body>

  <!-- 시작 화면: 한 번만 입력 -->
  <section id="login">
    <div class="login-card">
      <h1>어디까지가 우리의<br>땅, 바다, 하늘일까?</h1>

        <li data-n="3"><b>영역 관제소</b><span>레이더에 나타난 14가지 상황에서 올바른 관제 명령 내리기</span></li>
      </ol>

        <input id="inNum" placeholder="번호 (예: 12번)" autocomplete="off" inputmode="numeric">
        <input id="inName" class="full" placeholder="이름" autocomplete="off">
      </div>
      <p id="loginWarn" role="alert"></p>
      <button id="startBtn">탐구 시작하기</button>
    </div>
  </section>

  <!-- 활동 화면 -->
  <section id="app">
    <header class="bar">
      <div class="brand">우리나라의 영역</div>
      <nav class="steps">
        <button class="step" data-part="1" disabled><i>1</i><span>워밍업 퀴즈</span></button>
        <button class="step" data-part="2" disabled><i>2</i><span>영역 시뮬레이터</span></button>
        <button class="step" data-part="3" disabled><i>3</i><span>영역 관제소</span></button>
      </nav>
      <div class="status" id="status"></div>
      <button id="nextBtn">3부 관제소로 ▶</button>
      <div class="who" id="who"></div>
    </header>
    <main class="stage" id="stage"></main>
  </section>
  <div id="toast"></div>

          <!-- Card 3: EEZ -->

              <span id="chkEEZ" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-500 text-[9px]">🔒 영해 필요</span>

            <p id="descEEZ" class="text-slate-400 text-[10px] sm:text-[11px] leading-relaxed break-keep">

           <button id="btnReturnMainland" class="hidden w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl transition-all text-[11px] border border-slate-600 shadow-md active:scale-95">

  <!-- ========================================== -->
  <!-- 3. 심화 연계 활동 모달 (접속수역) -->
  <!-- ========================================== -->
  <div id="contiguousModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-3 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-slate-900 border border-amber-500/50 rounded-2xl max-w-xl w-full p-4 md:p-5 text-slate-200 shadow-2xl relative flex flex-col max-h-[90vh]">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
        <div class="flex items-center gap-2 md:gap-3">
          <span class="px-2 py-0.5 rounded-md bg-amber-950 border border-amber-600 text-amber-300 text-[10px] md:text-[11px] font-black">심화 탐구</span>
          <h3 class="text-sm md:text-lg font-black text-amber-300">24해리 접속수역은 왜 만들어졌을까?</h3>

            접속수역은 동해안이든 서·남해안이든 모두 동일하게 <strong>기선으로부터 24해리까지</strong> 설정되는 관세·위생(방역) 완충 구역입니다!

        <div class="bg-slate-950/80 border border-slate-800 p-3.5 md:p-4 rounded-xl mb-4">

          <p class="text-[11px] md:text-sm text-slate-300 mb-3 md:mb-4" id="czQuestion">
            <!-- 동적 질문 삽입 -->
          </p>
          <div class="grid grid-cols-2 gap-2 md:gap-3" id="czActionBtns">
            <button id="btnCzYes" class="py-2.5 md:py-3 px-1 md:px-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-[10px] md:text-xs font-bold transition-all shadow-md active:scale-95">
              ⭕ 조치할 수 있다! (접속수역)
            </button>
            <button id="btnCzNo" class="py-2.5 md:py-3 px-1 md:px-2 bg-rose-700 hover:bg-rose-600 text-white rounded-lg text-[10px] md:text-xs font-bold transition-all shadow-md active:scale-95">
              ❌ 영해 밖이라 관할 불가
            </button>

          <div id="czResultBox" class="hidden mt-3 p-3 rounded-lg text-xs transition-all animate-fade-in block"></div>
        </div>

      <!-- 동적 네비게이션 라우팅 버튼 영역 -->
      <div class="flex flex-col gap-2 mt-2 border-t border-slate-800 pt-3 md:pt-4">
        <div id="czDynamicButtons" class="flex flex-col sm:flex-row gap-2 w-full">
           <!-- Buttons will be injected here dynamically -->
        </div>
        <button onclick="restartSimFromDonghae();" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 font-bold rounded-xl text-[11px] md:text-xs transition-all shadow-sm active:scale-95">
          🔄 동해안부터 다시 해보기
        </button>

  <div id="errorBox" class="hidden fixed bottom-2 left-2 right-2 z-[60] bg-rose-950/95 border border-rose-500 text-rose-100 text-xs p-3 rounded-xl break-all"></div>
  <script>
    // [수정] 태블릿에서는 콘솔을 볼 수 없으므로, 오류가 나면 화면 하단에 표시
    window.addEventListener('error', (e) => {
      const box = document.getElementById('errorBox');
      if (box) { box.classList.remove('hidden'); box.textContent = '⚠️ 오류: ' + e.message + ' (줄 ' + e.lineno + ')'; }
    });

    // 1. 사전 탐구 퀴즈 시스템 (랜덤 출제 은행 + 카드조합 미션)
    const quizBank = [
      [
        { type: 'choice', question: "우리나라 헌법 제3조에 따른 대한민국의 영토 규정으로 옳은 것은?", options: [{ text: "한반도와 그 부속도서로 한다.", isCorrect: true, feedback: "정답! 북한 지역도 헌법상 대한민국의 영토에 포함됩니다." }, { text: "남한 지역과 그 부속도서로 한다.", isCorrect: false, feedback: "아닙니다. 헌법은 북한 지역을 포함한 한반도 전체를 영토로 봅니다." }] },
        { type: 'choice', question: "다음 중 대한민국 영토에 대한 설명으로 옳은 것은?", options: [{ text: "북한 지역은 우리나라의 영토가 아니다.", isCorrect: false, feedback: "틀렸습니다. 헌법 제3조에 따라 북한 지역도 대한민국의 영토입니다." }, { text: "북한 지역도 우리나라의 영토에 해당한다.", isCorrect: true, feedback: "정답! 헌법 제3조(한반도와 그 부속도서)에 의해 북한도 우리 영토입니다." }] }
      ],
      [
        { type: 'choice', question: "동해안과 서해안의 해안선 및 수심 특성으로 올바른 것은?", options: [{ text: "동해안은 해안선이 단조롭고, 서해안에 비해 수심이 깊다.", isCorrect: true, feedback: "정답! 동해안은 단조롭고 수심이 깊습니다." }, { text: "동해안은 해안선이 복잡하고, 서해안에 비해 수심이 얕다.", isCorrect: false, feedback: "반대로 설명되었습니다. 복잡하고 수심이 얕은 곳은 서해안입니다." }] },
        { type: 'choice', question: "다음 중 동해안과 서해안의 지형적 특징으로 알맞은 것은?", options: [{ text: "서해안은 해안선이 복잡하고 섬과 갯벌이 많다.", isCorrect: true, feedback: "정답! 서·남해안은 리아스식 해안으로 섬이 많고 복잡합니다." }, { text: "동해안은 해안선이 복잡하고 수심이 얕다.", isCorrect: false, feedback: "틀렸습니다. 복잡하고 얕은 곳은 서해안입니다." }] }
      ],
      [
        { type: 'choice', question: "조수간만의 차(밀물과 썰물의 차이)에 대한 설명으로 옳은 것은?", options: [{ text: "서해안은 동해안에 비해 조수간만의 차가 크다.", isCorrect: true, feedback: "정답! 서해안은 조차가 커서 갯벌이 발달합니다." }, { text: "동해안은 서해안에 비해 조수간만의 차가 매우 크다.", isCorrect: false, feedback: "아닙니다. 동해안은 조수간만의 차가 거의 없습니다." }] }
      ],
      [
        { type: 'choice', question: "영해를 측정하는 기준이 되는 선인 '기선(Baseline)'은 바닷물이 어떨 때를 기준으로 할까요?", options: [{ text: "썰물로 물이 가장 많이 빠졌을 때 (최저 조위선)", isCorrect: true, feedback: "정답! 영해를 최대한 넓게 확보하기 위해 썰물을 기준으로 합니다." }, { text: "밀물이 들어와 물이 꽉 찼을 때 (최고 조위선)", isCorrect: false, feedback: "아닙니다. 최고 조위선을 쓰면 바다 면적이 줄어듭니다." }] },
        { type: 'choice', question: "해안선이 복잡하고 섬이 많은 '서해안과 남해안'은 주로 어떤 기선을 사용할까요?", options: [{ text: "가장 바깥쪽 섬들을 직선으로 연결한 '직선기선'", isCorrect: true, feedback: "정답! 복잡한 서·남해안은 최외곽섬을 잇는 직선기선을 씁니다." }, { text: "썰물 때 해안선을 그대로 따르는 '통상기선'", isCorrect: false, feedback: "틀렸습니다. 복잡한 곳은 직선기선을 사용합니다." }] }
      ],
      [
        { 
          type: 'word-card', 
          correctAnswers: ["대한해협", "대마도", "직선", "3"], 
          wordBank: ["대한해협", "제주도", "대마도", "오키나와", "직선", "통상", "3", "12"]
        }
      ]
    ];

    let sessionQuiz = [];
    let currentQuizIndex = 0;
    
    function initSessionQuiz() {
      sessionQuiz = quizBank.map(category => category[Math.floor(Math.random() * category.length)]);
      currentQuizIndex = 0;
    }

    const quizScreen = document.getElementById('quizScreen');
    const simScreen = document.getElementById('simScreen');
    const quizQuestion = document.getElementById('quizQuestion');
    const quizOptions = document.getElementById('quizOptions');
    const quizFeedback = document.getElementById('quizFeedback');
    const btnNextQuiz = document.getElementById('btnNextQuiz');

    function loadQuiz() {
      const q = sessionQuiz[currentQuizIndex];
      document.getElementById('quizProgress').textContent = `MISSION ${currentQuizIndex + 1} / ${sessionQuiz.length}`;
      notifyApp('quiz', { index: currentQuizIndex + 1, total: sessionQuiz.length }); // [종합앱]
      quizFeedback.className = 'hidden';
      btnNextQuiz.classList.add('hidden');
      btnNextQuiz.textContent = "다음 미션으로 ➔";
      btnNextQuiz.className = 'hidden mt-3 w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-xl transition-all shadow-md active:scale-95 flex-shrink-0 text-sm sm:text-base';

      if (q.type === 'word-card') {
        quizQuestion.innerText = "제시된 카드를 탭하여 빈칸을 올바르게 채워 문장을 완성하세요.";
        quizOptions.innerHTML = '';
        quizOptions.className = 'flex flex-col gap-3 w-full';

        const sentenceBox = document.createElement('div');
        sentenceBox.className = 'text-xs sm:text-sm bg-slate-950 p-4 rounded-xl border border-slate-700 leading-loose text-center text-slate-200 break-keep';
        sentenceBox.innerHTML = `우리나라의 <span id="slot0" class="inline-block min-w-[50px] h-[24px] border-b-2 border-slate-500 mx-1 align-middle text-amber-300 font-bold cursor-pointer bg-slate-800 rounded px-1.5 transition-all hover:bg-slate-700"></span>은(는) 일본의 <span id="slot1" class="inline-block min-w-[50px] h-[24px] border-b-2 border-slate-500 mx-1 align-middle text-amber-300 font-bold cursor-pointer bg-slate-800 rounded px-1.5 transition-all hover:bg-slate-700"></span>와(과) 가까워 <span id="slot2" class="inline-block min-w-[40px] h-[24px] border-b-2 border-slate-500 mx-1 align-middle text-amber-300 font-bold cursor-pointer bg-slate-800 rounded px-1.5 transition-all hover:bg-slate-700"></span>기선 <span id="slot3" class="inline-block min-w-[30px] h-[24px] border-b-2 border-slate-500 mx-1 align-middle text-amber-300 font-bold cursor-pointer bg-slate-800 rounded px-1.5 transition-all hover:bg-slate-700"></span>해리를 적용하는 예외 지역이다.`;
        quizOptions.appendChild(sentenceBox);

        const wordBankBox = document.createElement('div');
        wordBankBox.className = 'flex flex-wrap justify-center gap-1.5 mt-2';
        
        const shuffledWords = [...q.wordBank].sort(() => Math.random() - 0.5);
        let currentSlots = [null, null, null, null];

        const renderBank = () => {
          wordBankBox.innerHTML = '';
          shuffledWords.forEach(word => {
            if (!currentSlots.includes(word)) {
              const btn = document.createElement('button');
              btn.className = 'px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 rounded-lg text-xs font-bold transition-all custom-shadow active:scale-95';
              btn.textContent = word;
              btn.onclick = () => {
                const emptyIdx = currentSlots.indexOf(null);
                if (emptyIdx !== -1) {
                  currentSlots[emptyIdx] = word; playTone(440, 0.05, 'sine'); updateSlots();
                }
              };
              wordBankBox.appendChild(btn);
            }
          });
        };

        const updateSlots = () => {
          for(let i=0; i<4; i++) {
            const slotEl = document.getElementById('slot'+i);
            slotEl.textContent = currentSlots[i] || '';
            if (currentSlots[i]) {
                slotEl.classList.add('slot-pop'); setTimeout(() => slotEl.classList.remove('slot-pop'), 200);
            }
            slotEl.onclick = () => {
              if (currentSlots[i]) {
                currentSlots[i] = null; playTone(330, 0.05, 'sine'); updateSlots();
              }
            };
          }
          renderBank();
          
          if (!currentSlots.includes(null)) {
            const isCorrect = currentSlots.every((val, index) => val === q.correctAnswers[index]);
            if (isCorrect) {
              quizFeedback.className = 'mt-3 p-2.5 rounded-xl text-center text-xs sm:text-sm font-bold bg-emerald-900/50 border border-emerald-500 text-emerald-200 block animate-fade-in flex-shrink-0';
              quizFeedback.textContent = "정답! 👏 일본과 거리가 좁아 중첩을 피하기 위해 3해리를 적용합니다.";
              playSnapSuccess();
              btnNextQuiz.classList.remove('hidden');
              btnNextQuiz.innerHTML = "🎉 미션 완료! 시뮬레이터 진입하기 ➔";
              btnNextQuiz.classList.replace('bg-cyan-600', 'bg-emerald-600');
              btnNextQuiz.classList.replace('hover:bg-cyan-500', 'hover:bg-emerald-500');
              
              for(let i=0; i<4; i++) {
                const s = document.getElementById('slot'+i);
                s.onclick = null; s.classList.replace('cursor-pointer', 'cursor-default');
              }
              wordBankBox.innerHTML = ''; 
            } else {
               quizFeedback.className = 'mt-3 p-2.5 rounded-xl text-center text-xs sm:text-sm font-bold bg-rose-900/50 border border-rose-500 text-rose-200 block animate-pop flex-shrink-0';
               quizFeedback.textContent = "문맥이 어색합니다. 단어를 탭하여 다시 배치해보세요.";
               playTone(220, 0.1, 'sawtooth');
            }
          } else {
             quizFeedback.className = 'hidden'; btnNextQuiz.classList.add('hidden');
          }
        };

        quizOptions.appendChild(wordBankBox);
        updateSlots();

      } else {
        quizQuestion.innerText = q.question;
        quizOptions.className = 'grid grid-cols-1 gap-2 sm:gap-3 w-full';
        quizOptions.innerHTML = '';
        q.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 rounded-xl text-xs sm:text-sm transition-all font-semibold active:scale-[0.98] text-left break-keep';
          btn.textContent = opt.text;
          btn.onclick = () => {
            Array.from(quizOptions.children).forEach(b => {
              b.disabled = true; b.classList.remove('hover:bg-slate-700'); b.classList.add('opacity-50');
            });
            btn.classList.remove('opacity-50', 'bg-slate-800', 'border-slate-600');
            
            if (opt.isCorrect) {
              btn.classList.add('bg-emerald-600', 'border-emerald-500', 'text-white');
              quizFeedback.className = 'mt-3 p-2.5 rounded-xl text-center text-xs sm:text-sm font-bold bg-emerald-900/50 border border-emerald-500 text-emerald-200 block animate-fade-in flex-shrink-0';
              playSnapSuccess();
            } else {
              btn.classList.add('bg-rose-700', 'border-rose-600', 'text-white');
              quizFeedback.className = 'mt-3 p-2.5 rounded-xl text-center text-xs sm:text-sm font-bold bg-rose-900/50 border border-rose-500 text-rose-200 block animate-fade-in flex-shrink-0';
              playTone(220, 0.1, 'sawtooth');
            }
            quizFeedback.textContent = opt.feedback;
            btnNextQuiz.classList.remove('hidden');
          };
          quizOptions.appendChild(btn);
        });
      }
    }

    // 퀴즈에서 시뮬레이터로 넘어가는 전환 버튼 이벤트 (렌더링 딜레이 최적화 적용)
    btnNextQuiz.addEventListener('click', () => {
      if (currentQuizIndex < sessionQuiz.length - 1) {
        currentQuizIndex++; loadQuiz();
      } else {
        notifyApp('part1Done'); // [종합앱] 1부 완료 알림
        quizScreen.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => {
          quizScreen.classList.add('hidden');
          simScreen.classList.remove('hidden');
          // 브라우저가 hidden 제거 후 크기를 100% 인식할 수 있도록 150ms 대기
          setTimeout(() => {
            initPuzzle(); 
            startLoop(); 
          }, 150);
        }, 500);
      }
    });

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playTone(freq, duration = 0.15, type = 'sine') {
      try {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}

    // ★ 태블릿/구형 브라우저에서 'ctx.roundRect' 충돌(흰 화면) 방지를 위한 강력한 호환성 헬퍼 함수 추가 ★
    function fillRoundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      ctx.fill();
    }
    
    function strokeRoundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      ctx.stroke();
    }

    const stars = Array.from({ length: 60 }, () => ({ x: Math.random() * 1400, y: Math.random() * 120, r: Math.random() * 1.5 + 0.4, alpha: Math.random() * 0.7 + 0.3 }));
    let activeDragItem = null;
    let dragOffset = { x: 0, y: 0 };

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
      let cx = e.clientX, cy = e.clientY;
      if (e.touches && e.touches.length > 0) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
      return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
    }

    function onPointerDown(e) {
      const pos = getCanvasPos(e); 
      const hitRadius = 40; 
      if (dokdoViewActive) {
        if (!dokdoBaselineEstablished && Math.hypot(dokdoBaselineTool.x - pos.x, dokdoBaselineTool.y - pos.y) <= hitRadius) {
          activeDragItem = dokdoBaselineTool; dragOffset.x = pos.x - dokdoBaselineTool.x; dragOffset.y = pos.y - dokdoBaselineTool.y; return;
        }
        if (dokdoBaselineEstablished && !dokdoPin12.placed && Math.hypot(dokdoPin12.x - pos.x, dokdoPin12.y - pos.y) <= hitRadius) {
          activeDragItem = dokdoPin12; dragOffset.x = pos.x - dokdoPin12.x; dragOffset.y = pos.y - dokdoPin12.y; return;
        } return;
      }
      if (!baselineEstablished) {
        if (Math.hypot(baselineTool.x - pos.x, baselineTool.y - pos.y) <= hitRadius) {
          activeDragItem = baselineTool; dragOffset.x = pos.x - baselineTool.x; dragOffset.y = pos.y - baselineTool.y; return;
        }
      } else {
        for (let pin of pins) {
          if (!pin.placed && Math.hypot(pin.x - pos.x, pin.y - pos.y) <= hitRadius) {
            activeDragItem = pin; dragOffset.x = pos.x - pin.x; dragOffset.y = pos.y - pin.y; return;
          }
        }
      }
    }

    function onPointerMove(e) {
      const pos = getCanvasPos(e);
      if (!activeDragItem) {
        const hoverRad = 40;
        if (dokdoViewActive) {
          dokdoBaselineTool.isHovered = (!dokdoBaselineEstablished && Math.hypot(dokdoBaselineTool.x - pos.x, dokdoBaselineTool.y - pos.y) <= hoverRad);
          dokdoPin12.isHovered = (dokdoBaselineEstablished && !dokdoPin12.placed && Math.hypot(dokdoPin12.x - pos.x, dokdoPin12.y - pos.y) <= hoverRad);
          canvas.style.cursor = (dokdoBaselineTool.isHovered || dokdoPin12.isHovered) ? 'pointer' : 'default';
        } else {
          baselineTool.isHovered = (!baselineEstablished && Math.hypot(baselineTool.x - pos.x, baselineTool.y - pos.y) <= hoverRad);
          pins.forEach(p => p.isHovered = (baselineEstablished && !p.placed && Math.hypot(p.x - pos.x, p.y - pos.y) <= hoverRad));
          canvas.style.cursor = (baselineTool.isHovered || pins.some(p => p.isHovered)) ? 'pointer' : 'default';
        } return;
      }
      canvas.style.cursor = 'grabbing';
      activeDragItem.x = Math.max(30, Math.min(pos.x - dragOffset.x, canvas.width - 30));
      activeDragItem.y = Math.max(20, Math.min(pos.y - dragOffset.y, canvas.height - 20));
    }

    function onPointerUp() {
      if (!activeDragItem) return;
      if (dokdoViewActive) {
        if (activeDragItem === dokdoBaselineTool) {
          if (Math.abs(activeDragItem.x - activeDragItem.getTargetX()) < 50) { dokdoBaselineEstablished = true; playSnapSuccess(); updateUI(); } 
          else { activeDragItem.x = activeDragItem.homeX(); activeDragItem.y = dyn.pinY; playTone(200, 0.08, 'sawtooth'); }
        } else if (activeDragItem === dokdoPin12) {
          if (Math.abs(activeDragItem.x - activeDragItem.getTargetX()) < 50) { dokdoPin12.placed = true; playSnapSuccess(); updateUI(); } 
          else { activeDragItem.x = activeDragItem.homeX(); activeDragItem.y = dyn.pinY; playTone(220, 0.08, 'sawtooth'); }
        }
      } else {
        if (activeDragItem === baselineTool) {
          if (Math.abs(activeDragItem.x - activeDragItem.getTargetX()) < 50) { baselineEstablished = true; playSnapSuccess(); updateUI(); } 
          else { 
            activeDragItem.x = activeDragItem.homeX(); 
            activeDragItem.y = dyn.pinY; playTone(200, 0.08, 'sawtooth'); 
          }
        } else {
          if (Math.abs(activeDragItem.x - activeDragItem.getTargetX()) < 50) { activeDragItem.placed = true; playSnapSuccess(); updateUI(); } 
          else {
            activeDragItem.x = activeDragItem.homeX();
            activeDragItem.y = dyn.pinY; playTone(220, 0.08, 'sawtooth');
          }
        }
      }
      activeDragItem = null; canvas.style.cursor = 'default';
    }

    canvas.addEventListener('mousedown', onPointerDown); window.addEventListener('mousemove', onPointerMove); window.addEventListener('mouseup', onPointerUp);

  <script>
    // =====================================================================
    // ⚙️ 점수 기록 설정 — 선생님이 바꾸는 곳은 여기뿐입니다
    // =====================================================================
    const CONFIG = {
      // 구글 Apps Script 웹 앱 URL (비워 두면 이 컴퓨터 브라우저에만 저장되는 '테스트 모드')
      SCRIPT_URL: '',
      TIME_LIMIT: 40,        // 점수 감소 기준 시간(초). 이 시간이 지나도 정답이면 500점 (화면에는 표시 안 됨, 강제 종료 없음)
      MAX_POINTS: 1000,      // 문항당 최고점. 정답이면 최소 절반(500점)은 보장
      RESULT_TOP: 5,         // 학생 결과 화면에 보여줄 순위 인원
      BOARD_REFRESH_SEC: 5,  // 순위판 자동 새로고침 간격(초)
    };

    Object.assign(CONFIG, (window.__APP_ENTRY || {}).config || {}); // [종합앱]

    // ---------- 공통 유틸 ----------
    function escapeHtml(v) {
      return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    // "1반" → "1", "01번" → "1", "홍 길동" → "홍길동"
    function normInfo(v) {
      let t = String(v || '').replace(/\s+/g, '').replace(/(반|번)$/, '');
      if (/^\d+$/.test(t)) t = String(parseInt(t, 10));
      return t;
    }
    function clsLabel(c) { return /^\d+$/.test(c) ? `${c}반` : c; }
    function fmtSec(sec) { return `${Number(sec).toFixed(1)}초`; }

    // 속도 점수 공식 (퀴즈앤·카훗 방식): 즉시 정답 1000점 → 기준 시간 이후 정답 500점, 오답 0점
    function calcPoints(sec) {
      const t = Math.min(Math.max(sec, 0), CONFIG.TIME_LIMIT);
      return Math.round(CONFIG.MAX_POINTS * (1 - (t / CONFIG.TIME_LIMIT) / 2));
    }

    // ---------- 서버 통신 (Apps Script) ----------
    async function callApi(body, timeoutMs = 10000) {
      if (!CONFIG.SCRIPT_URL) return localApi(body);
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        // text/plain 으로 보내야 CORS 사전 요청 없이 Apps Script에 도착합니다
        const res = await fetch(CONFIG.SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(body),
          signal: ctrl.signal,
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || '서버 오류');
        return data;
      } finally {
        clearTimeout(timer);
      }
    }

    // ---------- 테스트 모드: 서버 없이 이 브라우저에만 저장 (Apps Script와 같은 규칙) ----------
    function localApi(body) {
      const KEY = 'ssg_records_v1';
      const rows = JSON.parse(localStorage.getItem(KEY) || '[]');
      const key = [normInfo(body.cls), normInfo(body.num), normInfo(body.name)].join('|');
      const found = rows.find(r => r.key === key);
      const save = () => localStorage.setItem(KEY, JSON.stringify(rows));
      if (body.action === 'start') {
        if (found) return { ok: true, status: found.status, score: found.score };
        rows.push({ key, cls: normInfo(body.cls), num: normInfo(body.num), name: body.name, status: '진행중', startedAt: Date.now() });
        save();
        return { ok: true, status: 'new' };
      }
      if (body.action === 'submit') {
        if (found && found.status === '완료') return { ok: true, duplicate: true, existing: { score: found.score } };
        const rec = found || { key, cls: normInfo(body.cls), num: normInfo(body.num), name: body.name, startedAt: Date.now() };
        Object.assign(rec, { status: '완료', score: body.score, correct: body.correct, total: body.total, totalSec: body.totalSec, doneAt: Date.now(), detail: body.detail });
        if (!found) rows.push(rec);
        save();
        return { ok: true, duplicate: false };
      }
      if (body.action === 'rank') {
        const done = rows.filter(r => r.status === '완료');
        const classes = [...new Set(done.map(r => r.cls))].sort((a, b) => a.localeCompare(b, 'ko', { numeric: true }));
        const pool = done.filter(r => !body.filterCls || r.cls === normInfo(body.filterCls));
        pool.sort((a, b) => b.score - a.score || b.correct - a.correct || a.totalSec - b.totalSec || a.doneAt - b.doneAt);
        const meKey = body.name ? key : null;
        const meIdx = meKey ? pool.findIndex(r => r.key === meKey) : -1;
        const pick = r => ({ cls: r.cls, num: r.num, name: r.name, score: r.score, correct: r.correct, total: r.total, totalSec: r.totalSec });
        return {
          ok: true, total: pool.length, classes,
          top: pool.slice(0, Math.min(Number(body.top) || 10, 100)).map(pick),
          me: meIdx >= 0 ? { rank: meIdx + 1, ...pick(pool[meIdx]) } : null,
        };
      }
      return { ok: false, error: 'unknown action' };
    }

    // ---------- 순위 목록 그리기 (학생 결과 화면·순위판 공용) ----------
    function rankRowHtml(r, rank, big, highlight) {
      const medal = ['🥇', '🥈', '🥉'][rank - 1];
      const size = big ? 'text-lg sm:text-2xl py-3 px-4' : 'text-xs sm:text-sm py-2 px-3';
      const ring = highlight ? 'border-yellow-400 bg-yellow-950/40' : 'border-slate-800 bg-slate-900/80';
      return `
        <div class="flex items-center gap-3 rounded-xl border ${ring} ${size}">
          <span class="w-10 shrink-0 text-center font-black ${medal ? '' : 'text-slate-400'}">${medal || rank}</span>
          <span class="flex-1 min-w-0 truncate font-bold text-white">
            <span class="text-slate-400 font-normal mr-1">${escapeHtml(clsLabel(r.cls))} ${escapeHtml(r.num)}번</span>${escapeHtml(r.name)}
          </span>
          <span class="shrink-0 text-slate-400 ${big ? 'text-sm sm:text-base' : 'text-[11px]'}">${r.correct}/${r.total} · ${fmtSec(r.totalSec)}</span>
          <span class="shrink-0 w-24 text-right font-black text-yellow-300">${Number(r.score).toLocaleString()}</span>
        </div>`;
    }

    // ---------- 교사용 순위판 ----------
    let boardTimer = null;
    async function refreshBoard() {
      const status = document.getElementById('boardStatus');
      const sel = document.getElementById('boardClass');
      try {
        const data = await callApi({ action: 'rank', filterCls: sel.value, top: document.getElementById('boardTop').value });
        // 반 목록 갱신 (선택 유지)
        const cur = sel.value;
        sel.innerHTML = '<option value="">전체</option>' + data.classes.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(clsLabel(c))}</option>`).join('');
        sel.value = data.classes.includes(cur) ? cur : '';
        const list = document.getElementById('boardList');
        list.innerHTML = data.top.length
          ? data.top.map((r, i) => rankRowHtml(r, i + 1, true, false)).join('')
          : '<p class="text-slate-400 text-center py-16">아직 완료한 학생이 없습니다. 학생들이 훈련을 마치면 여기에 순위가 나타납니다.</p>';
        const mode = CONFIG.SCRIPT_URL ? '' : ' · ⚠️ 테스트 모드(이 컴퓨터 기록만 표시)';
        status.innerText = `참여 ${data.total}명 · ${CONFIG.BOARD_REFRESH_SEC}초마다 자동 갱신 · 마지막 갱신 ${new Date().toLocaleTimeString('ko-KR')}${mode}`;
      } catch (e) {
        status.innerText = `⚠️ 순위를 불러오지 못했습니다 (${e.message}). 인터넷 연결과 SCRIPT_URL을 확인하세요.`;
      }
    }
    function openBoard() {
      document.getElementById('introScreen').classList.add('hidden');
      const b = document.getElementById('boardScreen');
      b.classList.remove('hidden');
      b.classList.add('flex');
      refreshBoard();
      boardTimer = setInterval(refreshBoard, CONFIG.BOARD_REFRESH_SEC * 1000);
    }
    window.addEventListener('DOMContentLoaded', () => {
      if ((window.__APP_ENTRY || {}).board) openBoard(); // [종합앱]
    });

    // 오디오 컨텍스트 설정 (사용자 인터랙션 필요)
    let audioCtx = null;
    let audioEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      const btn = document.getElementById('soundToggle');
      btn.innerText = audioEnabled ? "ON" : "OFF";
      btn.className = audioEnabled ? "text-cyan-300 hover:underline" : "text-slate-500 hover:underline";
      if (audioEnabled) playTone(880, 'sine', 0.08);
    }

    function playTone(freq, type, duration) {
      if (!audioEnabled) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function soundBeep() { playTone(950, 'sine', 0.1); }
    function soundCorrect() {
      playTone(523, 'triangle', 0.1);
      setTimeout(() => playTone(659, 'triangle', 0.1), 100);
      setTimeout(() => playTone(783, 'triangle', 0.25), 200);
    }
    function soundWrong() {
      playTone(220, 'sawtooth', 0.2);
      setTimeout(() => playTone(180, 'sawtooth', 0.3), 150);
    }

    // 인트로 화면 로직 (로그인 및 매칭 게임)
    function startPreLearning() {
      initAudio(); // 첫 클릭 시 오디오 활성화
      const infoClass = document.getElementById('infoClass').value.trim();
      const infoName = document.getElementById('infoName').value.trim();
      const infoNumRaw = document.getElementById('infoNum').value.trim();
      
      if (!infoClass || !infoName || !infoNumRaw) {
        // alert 대신 UI 내 경고창 사용
        document.getElementById('loginWarning').classList.remove('hidden');
        document.getElementById('stepLogin').classList.add('shake-error');
        setTimeout(() => document.getElementById('stepLogin').classList.remove('shake-error'), 400);
        soundWrong();
        return;
      }
      
      document.getElementById('loginWarning').classList.add('hidden');
      
      // 관제관 이름 설정
      let userNum = document.getElementById('infoNum').value.trim();
      userNum = userNum ? ` ${userNum} ` : ' ';
      document.getElementById('studentNameDisplay').innerText = `${infoClass}${userNum}${infoName} 관제관`;
      studentInfo = { cls: normInfo(infoClass), num: normInfo(infoNumRaw), name: infoName.replace(/\s+/g, '') };
      
      soundBeep();
      document.getElementById('stepLogin').classList.add('hidden');
      document.getElementById('stepLearning').classList.remove('hidden');
    }

    let studentInfo = { cls: '', num: '', name: '' };
    let selectedTerm = null;
    let selectedDesc = null;
    let matchCount = 0;

    function selectTerm(btn) {
      initAudio();
      if (btn.classList.contains('matched')) return;
      document.querySelectorAll('.term-btn').forEach(b => {
        if(!b.classList.contains('matched')) b.classList.remove('ring-2', 'ring-cyan-400', 'bg-cyan-900');
      });
      btn.classList.add('ring-2', 'ring-cyan-400', 'bg-cyan-900');
      selectedTerm = btn;
      soundBeep();
      checkMatch();
    }

    function selectDesc(btn) {
      initAudio();
      if (btn.classList.contains('matched')) return;
      document.querySelectorAll('.desc-btn').forEach(b => {
        if(!b.classList.contains('matched')) b.classList.remove('ring-2', 'ring-cyan-400', 'bg-cyan-900');
      });
      btn.classList.add('ring-2', 'ring-cyan-400', 'bg-cyan-900');
      selectedDesc = btn;
      soundBeep();
      checkMatch();
    }

    function checkMatch() {
      if (selectedTerm && selectedDesc) {
        if (selectedTerm.dataset.match === selectedDesc.dataset.match) {
          // 정답 처리
          selectedTerm.classList.add('matched', 'bg-emerald-600', 'text-white', 'border-emerald-400');
          selectedDesc.classList.add('matched', 'bg-emerald-600', 'text-white', 'border-emerald-400');
          selectedTerm.classList.remove('ring-2', 'ring-cyan-400', 'bg-cyan-900', 'bg-slate-800', 'hover:bg-slate-700');
          selectedDesc.classList.remove('ring-2', 'ring-cyan-400', 'bg-cyan-900', 'bg-slate-800', 'hover:bg-slate-700');
          selectedTerm.innerHTML = "✅ " + selectedTerm.innerHTML;
          
          selectedTerm = null;
          selectedDesc = null;
          matchCount++;
          soundCorrect();
          
          if (matchCount === 3) {
            const startBtn = document.getElementById('startSimBtn');
            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-emerald-600');
            startBtn.classList.add('bg-gradient-to-r', 'from-cyan-500', 'to-emerald-500', 'hover:brightness-110', 'animate-pulse');
            startBtn.innerText = "🚀 시뮬레이션 본격 시작하기";
          }
        } else {
          // 오답 처리
          soundWrong();
          const t = selectedTerm; const d = selectedDesc;
          t.classList.add('bg-rose-900', 'shake-error'); d.classList.add('bg-rose-900', 'shake-error');
          setTimeout(() => {
            t.classList.remove('bg-rose-900', 'ring-2', 'ring-cyan-400', 'bg-cyan-900', 'shake-error');
            d.classList.remove('bg-rose-900', 'ring-2', 'ring-cyan-400', 'bg-cyan-900', 'shake-error');
          }, 400);
          selectedTerm = null;
          selectedDesc = null;
        }
      }
    }

    async function enterSimulator() {
      const startBtn = document.getElementById('startSimBtn');
      startBtn.disabled = true;
      startBtn.innerText = '📡 관제 본부에 접속하는 중…';
      try {
        const res = await callApi({ action: 'start', ...studentInfo }, 8000);
        // 이미 시작했거나 완료한 기록이 있으면 → 연습 모드
        isPractice = res.status !== 'new';
        practiceReason = res.status === '완료'
          ? `이미 첫 도전 기록(${Number(res.score).toLocaleString()}점)이 있어 이번 훈련은 연습으로 진행돼요.`
          : (isPractice ? '이미 첫 도전을 시작한 기록이 있어 이번 훈련은 연습으로 진행돼요. (다시 응시가 필요하면 선생님께 말씀하세요)' : '');
      } catch (e) {
        // 접속 실패 시에도 훈련은 진행하고, 끝날 때 제출을 다시 시도합니다
        isPractice = false;
        practiceReason = '';
      }
      if (!isPractice) notifyApp('attemptStart'); // [종합앱] 첫 도전 중에는 다른 단계로 이동 잠금
      updateModeBadge();
      soundCorrect();
      document.getElementById('introScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
      document.getElementById('mainApp').classList.add('flex');
      
      // UI 렌더링 후 레이더 초기화
      setTimeout(() => {
        resizeCanvas();
        loadScenario(0);
        renderRadar();
      }, 100);
    }

    const canvas = document.getElementById('radarCanvas');
    const ctx = canvas.getContext('2d');
    let sweepAngle = 0;
    let pulseCount = 0;
    let radarLogicalSize = 380;
    let animationId = null;

    function resizeCanvas() {
      const container = document.getElementById('canvasContainer');
      const rect = container ? container.getBoundingClientRect() : canvas.getBoundingClientRect();
      const rawSize = Math.floor(rect.width || 380);
      const size = Math.max(Math.min(rawSize, 420), 260);
      radarLogicalSize = size;
      const dpr = window.devicePixelRatio || 1;
      
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      canvas.style.width = size + 'px';
      canvas.style.height = size + 'px';

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);

    function renderRadar() {
      const size = radarLogicalSize;
      const cx = size / 2;
      const cy = size / 2;
      const maxR = size * 0.46;

      ctx.clearRect(0, 0, size, size);

      const boundaries = [
        { r: maxR * 0.20, stroke: 'rgba(239, 68, 68, 0.7)', fill: 'rgba(239, 68, 68, 0.12)', label: '영토·영공' },
        { r: maxR * 0.36, stroke: 'rgba(59, 130, 246, 0.65)', fill: 'rgba(59, 130, 246, 0.08)', label: '영해 (12NM)' },
        { r: maxR * 0.52, stroke: 'rgba(20, 184, 166, 0.55)', fill: 'rgba(20, 184, 166, 0.05)', label: '접속수역 (24NM)' },
        { r: maxR * 0.88, stroke: 'rgba(234, 179, 8, 0.45)', fill: 'rgba(234, 179, 8, 0.03)', label: 'EEZ (200NM)' }
      ];

      for (let i = boundaries.length - 1; i >= 0; i--) {
        const b = boundaries[i];
        ctx.beginPath(); ctx.arc(cx, cy, b.r, 0, Math.PI * 2);
        ctx.fillStyle = b.fill; ctx.fill();
        ctx.strokeStyle = b.stroke; ctx.lineWidth = 1.2;
        ctx.setLineDash([3, 4]); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = b.stroke; ctx.font = '9px monospace';
        ctx.fillText(b.label, cx + 5, cy - b.r + 10);
      }

      ctx.strokeStyle = 'rgba(6, 182, 212, 0.2)'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx, 10); ctx.lineTo(cx, size - 10);
      ctx.moveTo(10, cy); ctx.lineTo(size - 10, cy);
      ctx.stroke();

      ctx.fillStyle = 'rgba(100, 116, 139, 0.7)'; ctx.font = '10px monospace';
      ctx.fillText('N 000°', cx - 18, 18);
      ctx.fillText('E 090°', size - 42, cy - 4);
      ctx.fillText('S 180°', cx - 18, size - 8);
      ctx.fillText('W 270°', 6, cy - 4);

      ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#38bdf8'; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();

      if (currentScenarioIdx < scenarioDB.length) {
        const target = scenarioDB[currentScenarioIdx];
        const tDist = target.radarRadiusRatio * maxR;
        const tx = cx + Math.cos(target.radarAngle) * tDist;
        const ty = cy + Math.sin(target.radarAngle) * tDist;

        const pulseR = 8 + (Math.sin(pulseCount) + 1) * 6;
        ctx.beginPath(); ctx.arc(tx, ty, pulseR, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(244, 63, 94, 0.6)'; ctx.lineWidth = 1.5; ctx.stroke();

        ctx.beginPath(); ctx.arc(tx, ty, 5.5, 0, Math.PI * 2);
        ctx.fillStyle = '#f43f5e'; ctx.shadowColor = '#f43f5e'; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0;

        ctx.fillStyle = '#ffe4e6'; ctx.font = 'bold 10px monospace';
        ctx.fillText(`TARGET #${target.id}`, tx + 9, ty - 5);
      }

      ctx.save(); ctx.translate(cx, cy); ctx.rotate(sweepAngle);
      const grad = ctx.createLinearGradient(0, 0, maxR, 0);
      grad.addColorStop(0, 'rgba(6, 182, 212, 0.4)');
      grad.addColorStop(1, 'rgba(6, 182, 212, 0)');
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, maxR, 0, -0.35, true); ctx.closePath();
      ctx.fillStyle = 'rgba(6, 182, 212, 0.08)'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(maxR, 0);
      ctx.strokeStyle = 'rgba(34, 211, 238, 0.8)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();

      sweepAngle += 0.025; if (sweepAngle > Math.PI * 2) sweepAngle = 0;
      pulseCount += 0.08;
      
      animationId = requestAnimationFrame(renderRadar);
    }

    // 배열 무작위 섞기 헬퍼 함수
    function shuffleArray(array) {
      const newArr = [...array];
      for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
      }
      return newArr;
    }

    let currentScenarioIdx = 0;
    let nationalDefenseScore = 100;
    let answered = false;

    // 속도·정확도 점수 상태
    let gameScore = 0;
    let correctCount = 0;
    let totalElapsed = 0;
    let questionLog = [];      // 문항별 획득 점수
    let qStart = 0;
    let isPractice = false;    // true면 서버에 기록하지 않음
    let practiceReason = '';
    let pendingPayload = null; // 전송 실패 시 재전송용

    function updateModeBadge() {
      const b = document.getElementById('modeBadge');
      if (isPractice) {
        b.innerText = '🔁 연습 모드 · 기록 안 됨';
        b.className = 'px-2 py-0.5 rounded-full text-[11px] font-bold bg-slate-800 text-slate-300 border border-slate-600';
      } else {
        b.innerText = '🏁 첫 도전 · 기록됨';
        b.className = 'px-2 py-0.5 rounded-full text-[11px] font-bold bg-cyan-900/70 text-cyan-200 border border-cyan-600/60';
      }
      // 첫 도전 중에는 '다시 훈련하기'를 숨겨 문제를 미리 보고 다시 시작하는 것을 막음
      document.getElementById('restartLink').classList.toggle('hidden', !isPractice);
    }

    function updateGameScoreBadge(pop) {
      const el = document.getElementById('gameScoreBadge');
      el.innerText = gameScore.toLocaleString();
      if (pop) {
        el.classList.remove('score-pop');
        void el.offsetWidth; // 애니메이션 재시작
        el.classList.add('score-pop');
      }
    }

    // 문항이 화면에 나온 시각만 조용히 기록 (카운트다운·시간 초과 없음)
    function startTimer() {
      qStart = performance.now();
    }

    function loadScenario(index) {
      if (index >= scenarioDB.length) {
        showDebriefing();
        return;
      }

      answered = false;
      const data = scenarioDB[index];

      document.getElementById('stageBadge').innerText = `${index + 1} / ${scenarioDB.length}`;
      document.getElementById('targetCatBadge').innerText = data.category;
      document.getElementById('targetTitle').innerText = data.title;
      document.getElementById('targetLocation').innerText = data.location;
      document.getElementById('targetType').innerText = data.type;
      
      // DOM 요소 완전 교체로 텍스트 덮어쓰기 문제 완벽 방지
      const detailsContainer = document.getElementById('targetDetails');
      detailsContainer.innerHTML = data.details;

      const fb = document.getElementById('feedbackCard');
      fb.className = 'hidden';
      fb.innerHTML = '';
      
      // 4번 요구사항 버그 수정 (다시하기 누른 후 첫 문항 정체 버그 완벽 수정)
      const nextBtn = document.getElementById('nextBtn');
      nextBtn.classList.add('hidden');
      nextBtn.onclick = nextScenario; // 원래 이벤트 덮어쓰기로 복구
      nextBtn.innerHTML = `
        <span>다음 상황 해결하러 가기</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      `;

      const optContainer = document.getElementById('optionList');
      optContainer.innerHTML = '';

      // 랜덤 3지선다 생성 (정답 1 + 오답 2 셔플)
      const randomCorrect = data.correctOptions[Math.floor(Math.random() * data.correctOptions.length)];
      const markedCorrect = { ...randomCorrect, correct: true };
      const shuffledIncorrect = shuffleArray(data.incorrectOptions);
      const selectedIncorrect = shuffledIncorrect.slice(0, 2).map(opt => ({ ...opt, correct: false }));
      const finalOptions = shuffleArray([markedCorrect, ...selectedIncorrect]);

      finalOptions.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3 rounded-xl border border-slate-700 bg-slate-800/80 hover:bg-slate-700/80 hover:border-cyan-500 text-xs sm:text-sm text-slate-200 transition duration-150 flex items-start gap-2.5 active:scale-[0.99]";
        btn.innerHTML = `
          <span class="w-5 h-5 rounded-full bg-slate-700 text-cyan-300 font-bold flex items-center justify-center shrink-0 text-[11px]">${idx + 1}</span>
          <span class="leading-relaxed">${opt.text}</span>
        `;
        btn.onclick = () => handleChoice(opt, btn);
        optContainer.appendChild(btn);
      });
      
      soundBeep();
      startTimer();
    }

    function handleChoice(option, btnElement) {
      if (answered) return;
      answered = true;
      const sec = (performance.now() - qStart) / 1000;
      totalElapsed += Math.min(sec, CONFIG.TIME_LIMIT);

      const allBtns = document.querySelectorAll('#optionList button');
      allBtns.forEach(b => b.disabled = true);

      const fb = document.getElementById('feedbackCard');
      const nextBtn = document.getElementById('nextBtn');

      if (option.correct) {
        soundCorrect();
        btnElement.classList.remove('bg-slate-800/80', 'border-slate-700');
        btnElement.classList.add('bg-emerald-950/70', 'border-emerald-500', 'text-emerald-200');
        fb.className = "block p-3.5 rounded-xl text-xs sm:text-sm mb-3 bg-emerald-950/60 border border-emerald-500/60 text-emerald-200";
        const pts = calcPoints(sec);
        gameScore += pts;
        correctCount++;
        questionLog.push(pts);
        updateGameScoreBadge(true);
        fb.innerHTML = `<strong>[조치 승인: 적절한 관제 명령] +${pts.toLocaleString()}점</strong><br>${option.msg}`;
      } else {
        soundWrong();
        btnElement.classList.remove('bg-slate-800/80', 'border-slate-700');
        btnElement.classList.add('bg-rose-950/70', 'border-rose-500', 'text-rose-200');
        nationalDefenseScore = Math.max(0, nationalDefenseScore - 10);
        document.getElementById('scoreBadge').innerText = `${nationalDefenseScore}점`;
        fb.className = "block p-3.5 rounded-xl text-xs sm:text-sm mb-3 bg-rose-950/60 border border-rose-500/60 text-rose-200";
        questionLog.push(0);
        fb.innerHTML = `<strong>[조치 거부: 규정 위반] 0점</strong><br>${option.msg}`;
      }

      nextBtn.classList.remove('hidden');
    }

    function nextScenario() {
      currentScenarioIdx++;
      loadScenario(currentScenarioIdx);
    }

    function showDebriefing() {
      notifyApp('part3Done', { score: nationalDefenseScore }); // [종합앱]

      document.getElementById('targetCatBadge').innerText = "임무 완료";
      document.getElementById('targetTitle').innerText = "영역 관제 훈련 종합 성적표";
      document.getElementById('targetLocation').innerText = "대한민국 전역 (영토·영해·영공)";
      document.getElementById('targetType').innerText = "최종 관제 성적 보고서";
      
      let rank = "⭐ 대한민국 최정예 영역 수호대장 (만점 마스터)";
      let color = "text-emerald-400";
      if (nationalDefenseScore < 70) {
        rank = "🌱 훈련생 (사전 필수 교육을 다시 숙지하세요!)";
        color = "text-rose-400";
      } else if (nationalDefenseScore < 90) {
        rank = "🎖️ 든든한 대한민국 영역 지킴이";
        color = "text-yellow-400";
      }

      const userName = escapeHtml(document.getElementById('studentNameDisplay').innerText);

      document.getElementById('targetDetails').innerHTML = `
        <div class="space-y-3 pb-2">
          <p class="text-white font-bold text-lg border-b border-slate-700 pb-2 mb-2">👤 수료자: ${userName}</p>
          <p>나의 최종 방위 점수: <b class="${color} text-xl">${nationalDefenseScore}점</b></p>
          <p>나의 등급: <b class="${color}">${rank}</b></p>
          <p>관제 점수: <b class="text-yellow-300 text-xl">${gameScore.toLocaleString()}점</b> <span class="text-slate-400">/ ${(scenarioDB.length * CONFIG.MAX_POINTS).toLocaleString()}점</span></p>
          <p class="text-slate-400">정답 ${correctCount} / ${scenarioDB.length} · 총 응답 시간 ${fmtSec(totalElapsed)}</p>
        </div>
      `;

      document.getElementById('optionList').innerHTML = '';
      document.getElementById('feedbackCard').classList.add('hidden');
      
      const nextBtn = document.getElementById('nextBtn');
      nextBtn.classList.remove('hidden');
      nextBtn.innerHTML = `<span>처음부터 다시 도전하기</span>`;
      nextBtn.onclick = restartGame; // 재도전 시 restartGame 함수로 교체됨

      // 첫 도전이면 서버에 기록, 연습이면 순위만 보여줌
      if (!isPractice) {
        pendingPayload = {
          action: 'submit', ...studentInfo,
          score: gameScore, correct: correctCount, total: scenarioDB.length,
          totalSec: Math.round(totalElapsed * 10) / 10, detail: questionLog,
        };
        submitResult();
      } else {
        showMyRanking(`🔁 연습 결과는 순위에 반영되지 않아요. ${practiceReason}`);
      }
      isPractice = true; // 이후 도전은 모두 연습
      practiceReason = '첫 도전을 이미 마쳤어요.';
      document.getElementById('restartLink').classList.remove('hidden');
    }

    function statusBox(msg, tone = 'cyan') {
      return `<div class="p-3 rounded-xl text-xs sm:text-sm border border-${tone}-500/50 bg-${tone}-950/50 text-${tone}-200">${msg}</div>`;
    }

    async function submitResult() {
      const list = document.getElementById('optionList');
      list.innerHTML = statusBox('📡 첫 도전 기록을 관제 본부로 전송하는 중…');
      try {
        const res = await callApi(pendingPayload);
        const msg = res.duplicate
          ? `ℹ️ 이미 첫 도전 기록(${Number(res.existing.score).toLocaleString()}점)이 저장되어 있어 이번 결과는 반영되지 않았어요.`
          : '✅ 첫 도전 기록이 저장되었습니다!';
        pendingPayload = null;
        showMyRanking(msg);
      } catch (e) {
        list.innerHTML = statusBox(`⚠️ 기록 전송에 실패했습니다 (${escapeHtml(e.message)}). <b>화면을 닫지 말고</b> 아래 버튼을 눌러 다시 보내세요.`, 'rose')
          + `<button onclick="submitResult()" class="w-full mt-2 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 font-bold">📤 기록 다시 보내기</button>`;
      }
    }

    // [종합앱] 최종 결과 화면에서 교사용 순위판(실시간)을 새 탭으로 여는 버튼
    const openBoardBtnHtml = `<button onclick="notifyApp('openBoard')" class="w-full mt-3 py-2.5 rounded-xl border border-yellow-500/40 bg-yellow-950/30 text-yellow-300 font-bold hover:bg-yellow-900/40 transition-colors">🏆 현재 순위판 보기</button>`;

    async function showMyRanking(headMsg) {
      const list = document.getElementById('optionList');
      list.innerHTML = statusBox(headMsg) + '<p class="text-xs text-slate-400 mt-3">순위를 불러오는 중…</p>';
      try {
        const data = await callApi({ action: 'rank', ...studentInfo, filterCls: studentInfo.cls, top: CONFIG.RESULT_TOP });
        const meKey = r => String(r.cls) === studentInfo.cls && String(r.num) === studentInfo.num && String(r.name) === studentInfo.name;
        const rows = data.top.map((r, i) => rankRowHtml(r, i + 1, false, meKey(r))).join('');
        const me = data.me
          ? `<p class="text-sm text-center mt-3">나의 순위: <b class="text-yellow-300 text-lg">${data.me.rank}위</b> <span class="text-slate-400">/ ${data.total}명 (${data.me.score.toLocaleString()}점)</span></p>`
          : '';
        list.innerHTML = statusBox(headMsg)
          + `<p class="text-xs font-bold text-slate-300 mt-4 mb-2">🏆 ${escapeHtml(clsLabel(studentInfo.cls))} 순위 · 첫 도전 기준 상위 ${CONFIG.RESULT_TOP}명</p>`
          + `<div class="space-y-1.5">${rows || '<p class="text-xs text-slate-500">아직 기록이 없습니다.</p>'}</div>` + me
          + openBoardBtnHtml;
      } catch (e) {
        list.innerHTML = statusBox(headMsg) + `<p class="text-xs text-rose-300 mt-3">순위를 불러오지 못했습니다. (${escapeHtml(e.message)})</p>` + openBoardBtnHtml;
      }
    }

    function restartGame() {
      currentScenarioIdx = 0;
      nationalDefenseScore = 100;
      document.getElementById('scoreBadge').innerText = "100점";
      gameScore = 0; correctCount = 0; totalElapsed = 0; questionLog = [];
      updateGameScoreBadge(false);
      updateModeBadge();
      
      // 상태 초기화 후 첫 문항 재로드
      loadScenario(0); 
    }

    // [종합앱] 처음 화면에서 입력한 반·번호·이름으로 자동 로그인 → 바로 용어 연결 훈련부터
    (function () {
      const s = (window.__APP_ENTRY || {}).student;
      if (!s || (window.__APP_ENTRY || {}).board) return;
      document.getElementById('infoClass').value = s.cls;
      document.getElementById('infoNum').value = s.num;
      document.getElementById('infoName').value = s.name;
      startPreLearning();
    })();
  </script>
</template>

  <script>
    // =============================================================
    // 종합앱 진행 관리 (각 활동은 아래 <template> 안에 원본 그대로 들어 있고,
    //                   iframe 안에서 따로 실행되어 서로 간섭하지 않습니다)
    // =============================================================
    const APP = {
      student: null,
      current: 1,
      unlocked: 1,
      done: { 1: false, 2: false, 3: false },
      quiz: null,
      sim: { donghae: false, dokdo: false, seonam: false },
      frames: {},   // part12, part3
      locked: false, // 3부 첫 도전 중이면 true (다른 단계로 이동 금지)
    };
    const $ = id => document.getElementById(id);
    const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const params = new URLSearchParams(location.search);

    function buildDoc(tplId, entry) {
      const tpl = $(tplId);
      const prelude = '<script>window.__APP_ENTRY=' + JSON.stringify(entry).replace(/</g, '\\u003c') +
        ';function notifyApp(t,d){try{parent.postMessage(Object.assign({app:"territory",type:t},d||{}),"*")}catch(e){}}<\/script>';
      return '<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">' +
        '<meta name="viewport" content="width=device-width, initial-scale=1.0">' + prelude + '</head>' +
        '<body class="' + tpl.dataset.bodyClass + '">' + tpl.innerHTML + '</body></html>';
    }

    function ensureFrame(key, tplId, entry) {
      if (APP.frames[key]) return APP.frames[key];
      const f = document.createElement('iframe');
      f.title = key === 'part3' ? '영역 관제소' : '워밍업 퀴즈와 영역 시뮬레이터';
      f.srcdoc = buildDoc(tplId, entry);
      $('stage').appendChild(f);
      APP.frames[key] = f;
      return f;
    }

    function showPart(n) {
      APP.current = n;
      const key = n === 3 ? 'part3' : 'part12';
      if (key === 'part12') ensureFrame('part12', 'tpl-part12', { skipQuiz: APP.done[1] && !APP.frames.part12 });
      else ensureFrame('part3', 'tpl-part3', { student: APP.student, config: SCORE_CONFIG });
      Object.entries(APP.frames).forEach(([k, f]) => f.classList.toggle('on', k === key));
      render();
      setTimeout(() => APP.frames[key].focus(), 50);
    }

    function render() {
      document.querySelectorAll('.step').forEach(b => {
        const n = +b.dataset.part;
        const nowPart = APP.current === 3 ? 3 : (APP.done[1] ? 2 : 1);
        b.classList.toggle('now', n === nowPart);
        b.classList.toggle('done', APP.done[n] && n !== nowPart);
        // 2부·3부는 열린 뒤에는 오갈 수 있음 (1부는 2부와 같은 화면이라 이동 없음)
        const canGo = n !== 1 && n <= APP.unlocked && n !== nowPart && !APP.locked;
        b.disabled = !canGo;
        b.classList.toggle('open', canGo);
        b.querySelector('i').textContent = APP.done[n] && n !== nowPart ? '✓' : n;
      });

      const st = $('status');
      if (APP.current !== 3 && !APP.done[1]) {
        st.innerHTML = APP.quiz ? `<span class="label">미션</span><span class="chip ok">${APP.quiz.index} / ${APP.quiz.total}</span>` : '';
      } else if (APP.current !== 3) {
        const c = (k, t) => `<span class="chip ${APP.sim[k] ? 'ok' : ''}">${APP.sim[k] ? '✓ ' : ''}${t}</span>`;
        st.innerHTML = `<span class="label">완성할 해역</span>${c('donghae', '동해안')}${c('dokdo', '독도')}${c('seonam', '서·남해안')}`;
      } else {
        st.innerHTML = APP.done[3] ? '<span class="chip ok">🎉 모든 활동 완료</span>'
          : APP.locked ? '<span class="chip">🏁 첫 도전 중 · 끝날 때까지 다른 단계로 이동할 수 없어요</span>'
          : '<span class="label">레이더 상황 판단 훈련 중</span>';
      }

      $('nextBtn').classList.toggle('on', APP.done[2] && APP.current !== 3 && !APP.frames.part3);
    }

    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('on');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => t.classList.remove('on'), 2600);
    }

    // 각 활동(iframe)이 보내는 신호 받기
    window.addEventListener('message', e => {
      const d = e.data;
      if (!d || d.app !== 'territory') return;
      switch (d.type) {
        case 'quiz': APP.quiz = d; break;
        case 'part1Done': APP.done[1] = true; APP.unlocked = Math.max(APP.unlocked, 2); break;
        case 'simProgress': APP.sim = d.progress; break;
        case 'part2Done':
          APP.done[2] = true; APP.unlocked = 3;
          toast('세 해역을 모두 완성했어요! 3부로 이동할 수 있습니다.');
          break;
        case 'goNext': showPart(3); return;
        case 'attemptStart': APP.locked = true; break;
        case 'part3Done': APP.done[3] = true; APP.locked = false; break;
        case 'openBoard': window.open(location.pathname + '?board=1', '_blank'); return;
      }
      render();
    });

    document.querySelectorAll('.step').forEach(b => b.addEventListener('click', () => showPart(+b.dataset.part)));
    $('nextBtn').addEventListener('click', () => showPart(3));

    function norm(v) { return v.trim().replace(/\s+/g, ' '); }
    $('startBtn').addEventListener('click', () => {
      const cls = norm($('inCls').value), num = norm($('inNum').value), name = norm($('inName').value);
      if (!cls || !num || !name) { $('loginWarn').textContent = '반·번호·이름을 모두 입력해 주세요.'; return; }
      APP.student = { cls, num, name };
      $('who').innerHTML = `${esc(cls)} ${esc(num)} <b>${esc(name)}</b>`;
      $('login').style.display = 'none';
      $('app').classList.add('on');

      // 선생님 테스트용 바로가기: 주소 끝에 ?part=2 또는 ?part=3
      const jump = +params.get('part');
      if (jump >= 2) { APP.done[1] = true; APP.unlocked = 2; }
      if (jump === 3) { APP.done[2] = true; APP.unlocked = 3; showPart(3); }
      else showPart(jump === 2 ? 2 : 1);
    });
    // 교사용 순위판: 주소 끝에 ?board=1 (로그인 없이 순위판만 전체 화면으로)
    if (params.has('board')) {
      document.title = '첫 도전 순위판 — 우리나라의 영역';
      $('login').style.display = 'none';
      $('app').classList.add('on');
      document.querySelector('.bar').style.display = 'none';
      ensureFrame('part3', 'tpl-part3', { board: true, config: SCORE_CONFIG }).classList.add('on');
    }

    ['inCls', 'inNum', 'inName'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') $('startBtn').click(); }));
  </script>
</body>
</html>
