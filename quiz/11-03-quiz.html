<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<title>우리나라 여러 지역의 경쟁력 확인 문제</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#f7f5f0;color:#23211c;font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:oklch(.5 .13 58);text-decoration:none}
button{font-family:inherit;border:none;background:none;padding:0;color:inherit;cursor:pointer}

#퀴즈{max-width:560px;margin:0 auto;padding:20px 16px 60px}

.뒤로{font:500 12.5px/1 'Noto Sans KR';color:#8b8578;display:inline-flex;align-items:center;gap:3px}
.뒤로:hover{color:oklch(.5 .13 58)}

.머리{padding:12px 2px 18px;border-bottom:1px solid #eae5da;margin-bottom:18px}
.제목{font:800 24px/1.3 'Nanum Myeongjo',serif}
.안내{font:400 13px/1.6 'Noto Sans KR';color:#8b8578;margin-top:8px}

.카테고리바{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.카테고리{font:500 12.5px/1 'Noto Sans KR';border:1.5px solid #e6e1d6;color:#57534a;border-radius:20px;padding:10px 14px;background:#fffefb;transition:border-color .15s,background .15s,color .15s}
.카테고리:hover{border-color:#cfc7b4}
.카테고리 b{font-weight:700;opacity:.55;margin-left:2px}
.카테고리.활성{background:#23211c;border-color:#23211c;color:#f7f5f0}
.카테고리.활성 b{opacity:.55}

.상태바{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fffefb;border:1px solid #e6e1d6;border-radius:14px;padding:12px 16px;margin-bottom:18px}
.요약{font:500 13px/1 'Noto Sans KR';color:#57534a}
.요약 b{color:oklch(.5 .13 58)}
.상태버튼들{display:flex;gap:8px}
.다시버튼{font:500 12.5px/1 'Noto Sans KR';border:1.5px solid #23211c;color:#23211c;border-radius:20px;padding:9px 14px}
.더버튼{font:500 12.5px/1 'Noto Sans KR';border:1.5px solid oklch(.58 .13 58);color:oklch(.5 .13 58);border-radius:20px;padding:9px 14px}
.다시버튼[hidden],.더버튼[hidden]{display:none}

.문제카드{background:#fffefb;border:1px solid #e6e1d6;border-radius:16px;padding:18px 16px;margin-bottom:16px}

.문제머리{display:flex;align-items:flex-start;gap:10px}
.번호{flex:none;width:27px;height:27px;border-radius:50%;background:#23211c;color:#f7f5f0;display:flex;align-items:center;justify-content:center;font:700 12.5px/1 'Nanum Myeongjo',serif;margin-top:1px}
.지문{flex:1;font:500 15px/1.55 'Noto Sans KR';padding-top:2px}

.제출버튼{display:none;flex:none;opacity:0;transform:scale(.7);transition:opacity .16s,transform .16s;background:oklch(.58 .13 58);color:#fffefb;font:700 12px/1 'Noto Sans KR';border-radius:20px;padding:8px 13px;margin-top:1px}
.제출버튼.표시{display:inline-flex}
.제출버튼.보임{opacity:1;transform:scale(1)}
.제출버튼:hover{background:oklch(.52 .13 58)}

.설명박스{background:#faf7f0;border:1px solid #eae5da;border-radius:10px;padding:12px 14px;margin:12px 0 0;font:400 13.5px/1.65 'Noto Sans KR';color:#3c3a34}
.설명박스 p{margin:0}
.설명박스 p+p{margin-top:8px}
.설명박스 cite{display:block;margin-top:6px;text-align:right;font:400 12px/1 'Noto Sans KR';font-style:normal;color:#8b8578}
.설명박스 table{width:100%;border-collapse:collapse;margin:2px 0;font-size:13px;line-height:1.55}
.설명박스 th,.설명박스 td{border:1px solid #d9d2c0;padding:7px 9px;text-align:left;vertical-align:middle}
.설명박스 th{background:#f1ece0;font-weight:700;text-align:center}

.지도래퍼{border:1px solid #e6e1d6;border-radius:12px;overflow:hidden;background:#fffefb;padding:10px;margin:12px 0 0}
.지도목록{display:grid;gap:8px}
.지도목록.칸1{grid-template-columns:1fr}
.지도목록.칸2{grid-template-columns:repeat(2,1fr)}
.지도목록 figure{margin:0}
.지도목록 img{max-width:100%;width:auto;height:auto;display:block;margin:0 auto;border-radius:6px;border:1px solid #eae5da}
.지도목록 figcaption{text-align:center;font:700 11.5px/1 'Noto Sans KR';color:#8b8578;padding-top:6px}

.보기목록{display:flex;flex-direction:column;gap:9px;margin:14px 0 0}
.보기{position:relative;display:flex;align-items:center;gap:11px;padding:11px 13px;border:1.5px solid #e6e1d6;border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s}
.보기:hover{border-color:#cfc7b4}
.보기입력{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.보기:focus-within{outline:2px solid oklch(.58 .13 58);outline-offset:2px}
.보기마커{flex:none;font:700 13.5px/1 'Nanum Myeongjo',serif;color:#8b8578;width:18px}
.보기글{flex:1;font:400 14px/1.5 'Noto Sans KR'}
.보기.선택됨{border-color:oklch(.58 .13 58);background:oklch(.97 .025 78)}
.보기.선택됨 .보기마커{color:oklch(.5 .13 58)}
.보기.정답{border-color:oklch(.55 .12 152);background:oklch(.96 .035 152)}
.보기.정답::after{content:'✓';margin-left:auto;padding-left:8px;font:800 14px/1 'Noto Sans KR';color:oklch(.42 .13 152)}
.보기.오답선택{border-color:#b0503a;background:#fbece6}
.보기.오답선택::after{content:'✕';margin-left:auto;padding-left:8px;font:800 14px/1 'Noto Sans KR';color:#b0503a}
.보기목록.잠김{pointer-events:none}

.결과영역{margin:14px 0 0;padding-top:14px;border-top:1px dashed #e6e1d6}
.결과배지{display:inline-block;font:700 11px/1 'Noto Sans KR';padding:6px 11px;border-radius:20px;margin-bottom:10px}
.결과배지.맞음{background:oklch(.94 .045 152);color:oklch(.38 .12 152)}
.결과배지.틀림{background:#fbeae6;color:#a83a2e}
.정답줄{font:500 13.5px/1.5 'Noto Sans KR';margin:0 0 10px;color:#3c3a34}
.해설{font:400 13.5px/1.75 'Noto Sans KR';color:#57534a;background:#faf8f3;border-radius:10px;padding:12px 14px}
.해설 b{display:block;color:#23211c;font-weight:700;margin-bottom:5px;font-size:12px;letter-spacing:.02em}

@media (min-width:760px){
  #퀴즈{max-width:780px;padding:30px 26px 70px}
  .제목{font-size:30px}
  .안내{font-size:14.5px}
  .카테고리{font-size:13.5px;padding:11px 16px}
  .문제카드{padding:24px 24px}
  .번호{width:30px;height:30px;font-size:14px}
  .지문{font-size:16.5px}
  .설명박스,.지도래퍼,.보기목록,.결과영역{margin-left:41px}
  .지도목록.칸2{grid-template-columns:repeat(2,1fr)}
  .보기글{font-size:15px}
  .해설{font-size:14.5px}
}
</style>
</head>
<body>

<div id="퀴즈">
  <a class="뒤로" href="../index.html">‹ 자료실로</a>
  <div class="머리">
    <div class="제목">03. 우리나라 여러 지역의 경쟁력 · 확인 문제</div>
    <div class="안내">카테고리를 골라 풀어보세요. 답을 고르면 번호 왼쪽에 제출 버튼이 나타나고, 제출하면 정답과 해설을 볼 수 있어요. 한 카테고리에 최대 5문제씩 나오고, 다 풀면 '문제 더 풀기'로 이어서 풀 수 있어요.</div>
  </div>

  <div class="카테고리바" id="카테고리바"></div>

  <div class="상태바">
    <span class="요약" id="요약">제출 0 / 5</span>
    <div class="상태버튼들">
      <button class="다시버튼" id="다시풀기" hidden>다시 풀기</button>
      <button class="더버튼" id="문제더풀기" hidden>문제 더 풀기</button>
    </div>
  </div>

  <div id="문제목록"></div>
</div>

<script>
const 동그라미 = ['①','②','③','④','⑤'];

const 카테고리목록 = [
  { key: '지역화전략', label: '지역화와 지역화 전략' },
  { key: '지역브랜드', label: '지역 브랜드' },
  { key: '장소마케팅', label: '장소 마케팅과 지리적 표시제' }
];

const 문제전체 = [
  /* ── 지역화와 지역화 전략 ── */
  {
    카테고리: '지역화전략',
    지문: "지역 경쟁력에 대한 설명으로 옳지 않은 것은?",
    보기: [
      "지역 경제를 활성화할 수 있다.",
      "교통과 통신이 발달하면서 경쟁이 치열해졌다.",
      "각 지역은 좋은 이미지를 구축하기 위해 노력하고 있다.",
      "지역 브랜드, 장소 마케팅을 통해 경쟁력을 높일 수 있다.",
      "경제적·문화적 관점에서 다른 지역과 동일시될 수 있는 경쟁력을 말한다."
    ],
    정답: 4,
    해설: "세계화로 교통과 통신이 발달하고 지역 간 교류가 활발해지면서 지역 고유의 특성을 살리는 것이 그 지역의 경쟁력으로 작용하고 있다. 지역 경쟁력은 경제적·문화적 관점에서 다른 지역과 차별화할 수 있는 힘이므로, 다른 지역과 동일시될 수 있다는 설명은 옳지 않다. 지역화 전략은 이러한 세계화 요구에 부응하기 위해 다른 지역과 차별화할 수 있는 계획을 마련하는 것으로 지역 브랜드, 장소 마케팅, 지리적 표시제 등이 있다."
  },
  {
    카테고리: '지역화전략',
    지문: "우리나라의 여러 지역에서 다음과 같은 노력을 하는 이유로 옳은 것을 <보기>에서 고른 것은?",
    설명박스: [
      "• 순천은 순천만 일대의 연안 습지와 갯벌을 자연 생태 공원으로 개발하였다. 낙안 읍성 등을 비롯한 관광 자원을 연계하여 세계적인 생태 도시로 거듭나기 위해 노력하고 있다.",
      "• 부산은 해마다 부산 국제 영화제를 개최하여 성공하고 있다. 이를 통해 부산은 문화 예술 도시로 떠오르게 되어 부산의 영상 산업 유치와 활성화를 통해 지역 경쟁력을 강화하고 있다.",
      "&lt;보기&gt;<br>ㄱ. 깨끗한 자연환경을 보존하기 위해서이다.<br>ㄴ. 유네스코 세계 문화유산으로 등재하기 위해서이다.<br>ㄷ. 다른 지역과 차별화된 지역 특성을 개발하기 위해서이다.<br>ㄹ. 지역의 가치를 높이고 긍정적인 지역 이미지를 구축하기 위해서이다."
    ],
    보기: ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"],
    정답: 4,
    해설: "제시된 사례는 각 지역이 해당 지역의 가치를 높이고 긍정적인 지역 이미지를 구축하여 다른 지역과 차별화된 지역 특성을 만들기 위해 노력하고 있음을 보여 준다."
  },
  {
    카테고리: '지역화전략',
    지문: "㉠에 들어갈 용어로 옳은 것은?",
    설명박스: [
      "지역의 경쟁력을 높이기 위해 경제적·문화적 측면에서 다른 지역과 차별화할 수 있는 계획을 마련하는 것을 <u>&nbsp;㉠&nbsp;</u>(이)라고 한다."
    ],
    보기: ["세계화", "정보화", "지역성", "지역화", "지역화 전략"],
    정답: 4,
    해설: "지역의 경쟁력을 높이기 위해 경제적·문화적 관점에서 다른 지역과 차별화할 수 있는 계획을 마련하는 것을 지역화 전략이라고 한다. 지역화 전략으로는 지역 브랜드 구축, 장소 마케팅 시행, 지리적 표시제 등록 등이 대표적이다."
  },
  {
    카테고리: '지역화전략',
    지문: "다음 글에 나타난 지역화에 대한 옳은 설명을 <보기>에서 고른 것은?",
    설명박스: [
      "경상북도의 안동 하회마을은 다양한 노력을 통해 2010년에 유네스코 세계 문화유산으로 등재되었다. 이제는 우리나라 사람뿐만 아니라 외국인 관광객도 많이 찾는 유명한 곳이 되어, 우리나라를 세계에 알리는 역할을 하고 있다.",
      "&lt;보기&gt;<br>ㄱ. 지역화와 세계화는 동시에 일어나지 않는다.<br>ㄴ. 지역 경쟁력은 국가 경쟁력의 바탕을 이룬다.<br>ㄷ. 지역 경쟁력이 강화되면 국가 경쟁력은 약화된다.<br>ㄹ. 지역이 가지는 장점은 지역의 수준을 넘어 세계적인 가치를 지닌다."
    ],
    보기: ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"],
    정답: 3,
    해설: "제시된 글은 안동 하회마을을 나타낸다. 세계화로 지역의 경쟁을 제한하는 장벽이 사라지면서 시골 마을이었던 하회마을은 지역화를 이루어 세계적인 가치를 지니게 되었다. 지역화는 세계화와 함께 나타나는 흐름이며(ㄱ), 지역 경쟁력이 강화되면 국가 경쟁력도 함께 높아진다(ㄷ)."
  },

  /* ── 지역 브랜드 ── */
  {
    카테고리: '지역브랜드',
    지문: "효과적인 지역 브랜드 개발 전략에 대한 옳은 설명만을 <보기>에서 있는 대로 고른 것은?",
    설명박스: [
      "&lt;보기&gt;<br>ㄱ. 중앙 정부가 주도하여 개발한다.<br>ㄴ. 지역 주민과 긴밀하게 협력한다.<br>ㄷ. 해당 지역의 고유한 특성과 가치를 정확히 파악한다.<br>ㄹ. 해당 지역의 자연환경과 역사, 문화, 산업, 인물 등을 활용한다."
    ],
    보기: ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"],
    정답: 4,
    해설: "ㄴ, ㄷ, ㄹ. 효과적인 지역 브랜드 개발을 위해서는 지역의 자연환경과 역사, 문화, 산업, 인물 등을 활용하여 그 지역만의 고유한 특성과 가치를 정확히 파악해야 하고, 지역 주민의 참여와 협조가 필요하다. ㄱ. 지역 브랜드에는 지역 고유의 특징이 반영되어야 하므로, 중앙 정부가 아닌 지방 정부와 지역 주민이 지역 브랜드 개발을 주도해야 한다."
  },
  {
    카테고리: '지역브랜드',
    지문: "지역 브랜드 개발 시 주의 사항에 대한 설명으로 옳지 않은 것은?",
    보기: [
      "지역의 핵심적인 정체성을 브랜드로 만든다.",
      "개발 과정에서 지역 주민들의 참여가 필수적이다.",
      "지역 브랜드를 개발한 후에는 장소 마케팅에 적극적으로 활용한다.",
      "다른 지역과 차별화할 수 있는 슬로건, 로고, 캐릭터 등을 개발한다.",
      "중앙 정부의 획일적인 개발 방식을 채택해야 효율적으로 진행할 수 있다."

function 셔플(원본배열) {
  const a = 원본배열.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  해설제목.textContent = '해설';
  const 해설글 = document.createElement('p');
  해설글.textContent = 문제.해설;
  해설글.style.margin = '0';
  해설칸.append(해설제목, 해설글);

  결과.append(배지, 정답줄, 해설칸);
  카드.appendChild(결과);

  제출버튼.addEventListener('click', () => {
    const 선택된 = 보기목록.querySelector('input:checked');
    if (!선택된) return;
    const 고른값 = parseInt(선택된.value, 10);
    const 맞음 = 고른값 === 문제.정답;

    보기라벨들.forEach((l, i) => {
      l.querySelector('input').disabled = true;
      if (i === 문제.정답) l.classList.add('정답');
      else if (i === 고른값) l.classList.add('오답선택');
    });
    보기목록.classList.add('잠김');

    배지.textContent = 맞음 ? '정답이에요' : '아쉬워요, 오답이에요';
    배지.className = '결과배지 ' + (맞음 ? '맞음' : '틀림');
    정답줄.innerHTML = '정답은 <b>' + 동그라미[문제.정답] + '번</b>이에요.';
    결과.hidden = false;
    제출버튼.remove();

    if (!제출됨[idx]) {
      제출됨[idx] = true;
      if (맞음) 정답수++;
      요약갱신();
    }
  });

  return 카드;
}

function 카테고리선택(key) {
  현재카테고리 = key;
  카테고리풀 = 셔플(문제전체.filter(q => q.카테고리 === key));
  표시개수 = Math.min(5, 카테고리풀.length);
  제출됨 = new Array(표시개수).fill(false);
  정답수 = 0;

  카테고리바그리기();
  const 목록칸 = document.getElementById('문제목록');
  목록칸.innerHTML = '';
  for (let i = 0; i < 표시개수; i++) 목록칸.appendChild(문제카드만들기(카테고리풀[i], i));
  요약갱신();
  scrollTo({ top: 0, behavior: 'smooth' });
}

function 문제더풀기() {
  const 새표시개수 = Math.min(표시개수 + 5, 카테고리풀.length);
  const 목록칸 = document.getElementById('문제목록');
  for (let i = 표시개수; i < 새표시개수; i++) {
    제출됨.push(false);
    목록칸.appendChild(문제카드만들기(카테고리풀[i], i));
  }
  표시개수 = 새표시개수;
  요약갱신();
}

function 요약갱신() {
  const 제출수 = 제출됨.filter(Boolean).length;
  document.getElementById('요약').innerHTML = '제출 <b>' + 제출수 + '</b> / ' + 표시개수 +
    (제출수 ? '  ·  정답 <b>' + 정답수 + '</b>개' : '');
  document.getElementById('다시풀기').hidden = 제출수 === 0;
  document.getElementById('문제더풀기').hidden = !(제출수 === 표시개수 && 표시개수 < 카테고리풀.length);
}

document.getElementById('다시풀기').onclick = () => 카테고리선택(현재카테고리);
document.getElementById('문제더풀기').onclick = 문제더풀기;

카테고리선택(현재카테고리);
</script>
</body>
</html>
